name: Aegis VPN Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-firestore-rules:
    name: Verify Firestore Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Firebase CLI and Rules Unit Testing
        run: |
          npm install -g firebase-tools
          npm install --no-save @firebase/rules-unit-testing

      - name: Run Firestore Security Rules Tests
        run: |
          firebase emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"

  build-and-test-android:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure google-services.json exists for CI
        if: ${{ hashFiles('app/google-services.json') == '' && secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
